<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head study 01</title>
<style>
  :root { --paper: #F5F5EF; --ink: #312F28; --muted: #A7A199; --surface: #D0CCC3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; }
  /* Sideways drags turn the head; up and down is left to the page, so a phone can still scroll past it. */
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<script src="bricks.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const data = window.HEAD_BRICKS;
const n = data.count;
const params = new URLSearchParams(location.search);
const fixedYaw = params.has('yaw') ? Number(params.get('yaw')) * Math.PI / 180 : null;
// ?mode=halftone|twotone|colour. ?ink=3D8FA0 prints the halftone in another ink;
// ?tint=3D8FA0 runs it from that colour in the light bricks to the ink in the dark ones.
const mode = params.get('mode') || 'halftone';
// A page that hosts the head can set it smaller or off-centre: ?size=0.85&x=-0.03 (x in screen widths, negative is left).
const zoom = Number(params.get('size')) || 1, shift = Number(params.get('x')) || 0;

const INK = new THREE.Color('#' + (params.get('ink') || '312F28'));
const TINT = params.has('tint') ? new THREE.Color('#' + params.get('tint')) : null;
const SURFACE = new THREE.Color('#D0CCC3');
const BACKING = new THREE.Color('#ECEAE2');

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 1, 1000);
camera.position.set(0, 0, 170);

scene.add(new THREE.HemisphereLight('#ffffff', '#8a857a', 2.4));
const key = new THREE.DirectionalLight('#ffffff', 1.6);
key.position.set(40, 60, 90);
scene.add(key);

const head = new THREE.Group();
scene.add(head);
const box = new THREE.BoxGeometry(1, 1, 1);
const mesh = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial(), n);
// A solid backing brick under every visible one, so gaps never show the far side of the shell.
const backing = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial(), n);
head.add(backing, mesh);

// How dark each brick is, 0 (light skin) to 1 (hair), from the projected photos.
const dark = new Float32Array(n);
for (let i = 0; i < n; i++) {
  const lum = 0.299 * data.col[i * 3] + 0.587 * data.col[i * 3 + 1] + 0.114 * data.col[i * 3 + 2];
  dark[i] = Math.min(1, Math.max(0, (185 - lum) / 135));
}

const m = new THREE.Matrix4();
const c = new THREE.Color();
const size = new Float32Array(n);   // visible brick edge, set by the mode
const rest = new Float32Array(n);   // how far it sits off the backing, at rest
const push = new Float32Array(n);   // how far the cursor has lifted it beyond that
const vel = new Float32Array(n);
// Each brick tumbles about its own fixed axis as it lifts, so the motion reads from straight on too.
const axis = Array.from({ length: n }, (_, i) => new THREE.Vector3(Math.sin(i * 12.9898), Math.sin(i * 78.233), Math.sin(i * 37.719)).normalize());
const TUMBLE = 0.45;   // radians per brick of lift

// Put every visible brick at rest + push along its normal. Backing bricks never move.
const at3 = new THREE.Vector3(), turn = new THREE.Quaternion(), edge = new THREE.Vector3();
function place() {
  for (let i = 0; i < n; i++) {
    const d = rest[i] + push[i];
    at3.set(data.pos[i * 3] + data.nrm[i * 3] * d, data.pos[i * 3 + 1] + data.nrm[i * 3 + 1] * d, data.pos[i * 3 + 2] + data.nrm[i * 3 + 2] * d);
    mesh.setMatrixAt(i, m.compose(at3, turn.setFromAxisAngle(axis[i], push[i] * TUMBLE), edge.setScalar(size[i])));
  }
  mesh.instanceMatrix.needsUpdate = true;
}

function paint() {
  for (let i = 0; i < n; i++) {
    size[i] = 0.9;
    if (mode === 'colour') {
      c.setRGB(data.col[i * 3] / 255, data.col[i * 3 + 1] / 255, data.col[i * 3 + 2] / 255, THREE.SRGBColorSpace);
    } else if (mode === 'twotone') {
      c.copy(dark[i] > 0.5 ? INK : SURFACE);
    } else {
      // Halftone in 3D: every brick is ink, and darkness sets its size.
      if (TINT) c.copy(TINT).lerp(INK, Math.pow(dark[i], 1.6)); else c.copy(INK);
      size[i] = 0.16 + 0.8 * Math.pow(dark[i], 0.85);
    }
    // Visible brick rests on the backing's outer face; backing sits a quarter brick inward.
    const [x, y, z] = [data.pos[i * 3], data.pos[i * 3 + 1], data.pos[i * 3 + 2]];
    const [nx, ny, nz] = [data.nrm[i * 3], data.nrm[i * 3 + 1], data.nrm[i * 3 + 2]];
    rest[i] = mode === 'halftone' ? 0.15 + size[i] / 2 : 0;
    mesh.setColorAt(i, c);
    m.makeScale(1, 1, 1).setPosition(x - nx * 0.25, y - ny * 0.25, z - nz * 0.25);
    backing.setMatrixAt(i, m);
    backing.setColorAt(i, mode === 'halftone' ? BACKING : INK);
  }
  place();
  backing.instanceMatrix.needsUpdate = true;
  for (const im of [mesh, backing]) im.instanceColor.needsUpdate = true;
}
paint();

// Drag to turn; left alone, the head sways slowly.
let yaw = fixedYaw ?? 0.5, pitch = 0, dragging = false, lastX = 0, lastY = 0, idleSince = -1e9;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw += (e.clientX - lastX) * 0.008;
  pitch = Math.max(-0.5, Math.min(0.5, pitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
for (const end of ['pointerup', 'pointercancel']) canvas.addEventListener(end, () => { dragging = false; idleSince = performance.now(); });

// Bricks under the cursor rise off the head, and spring back once it moves on.
// ?at=x,y pins the cursor (in -1..1 screen units) for screenshots.
const REACH = 4.5, RADIUS = 6.5;   // in bricks: how far they rise, and how wide the bump is
const cursor = new THREE.Vector2();
const at = params.get('at');
let over = at !== null, awake = false;
if (at) cursor.set(...at.split(',').map(Number));
canvas.addEventListener('pointermove', (e) => { cursor.set(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2); over = true; });
canvas.addEventListener('pointerleave', () => { over = false; });
const caster = new THREE.Raycaster();
const inv = new THREE.Matrix4();
const ray = new THREE.Ray();
function stir() {
  if (!over && !awake) return;
  // The cursor's ray in the head's own space, so brick positions can be used as stored.
  head.updateMatrixWorld();
  caster.setFromCamera(cursor, camera);
  ray.copy(caster.ray).applyMatrix4(inv.copy(head.matrixWorld).invert());
  const o = ray.origin, d = ray.direction;
  awake = false;
  for (let i = 0; i < n; i++) {
    let target = 0;
    // Only bricks facing the viewer respond, by their distance from the ray.
    if (over && data.nrm[i * 3] * d.x + data.nrm[i * 3 + 1] * d.y + data.nrm[i * 3 + 2] * d.z < -0.15) {
      const vx = data.pos[i * 3] - o.x, vy = data.pos[i * 3 + 1] - o.y, vz = data.pos[i * 3 + 2] - o.z;
      const along = vx * d.x + vy * d.y + vz * d.z;
      target = REACH * Math.exp(-(vx * vx + vy * vy + vz * vz - along * along) / (2 * RADIUS * RADIUS));
    }
    vel[i] = (vel[i] + (target - push[i]) * 0.1) * 0.82;
    push[i] += vel[i];
    if (Math.abs(vel[i]) > 1e-3 || Math.abs(push[i]) > 1e-3) awake = true;
  }
  place();
}

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const still = reduced || fixedYaw !== null;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.z = w / h < 0.8 ? 230 : 170;
  camera.zoom = zoom;
  if (shift) camera.setViewOffset(w, h, -shift * w, 0, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let last = 0, owed = 0;
renderer.setAnimationLoop((t) => {
  if (!still && !dragging && t - idleSince > 2500) {
    const target = Math.sin(t * 0.00025) * 0.9;
    yaw += (target - yaw) * 0.01;
    pitch += (0 - pitch) * 0.02;
  }
  head.rotation.set(pitch, yaw, 0);
  // The springs step at 60 a second whatever the display's refresh rate.
  owed = Math.min(owed + t - last, 50);
  last = t;
  for (; owed >= 16; owed -= 16) if (!reduced) stir();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
